; php:8.3-fpm-alpine ships with no active php.ini at all (only the
; php.ini-production/-development samples, neither copied in) — PHP falls
; back to its compiled-in defaults, upload_max_filesize=2M/post_max_size=8M.
; Every media upload in this app (tournament post_media, news media, QR
; codes) validates up to 15MB per file server-side and nginx.conf.template
; already allows a 20M request body, so PHP itself was the actual
; bottleneck: any file over 2MB failed at the PHP layer with "The
; post_media.0 failed to upload." before Laravel's own `max:15360` rule
; ever got a chance to run. Matches nginx's existing 20M client_max_body_size
; ceiling rather than inventing a separate, looser one.
upload_max_filesize = 20M
post_max_size = 20M
