name: Keep Render services awake

# Render's free web-service plan sleeps a service after ~15 minutes with no
# traffic; the next real request then pays a 30-60s+ cold-boot penalty. This
# pings both free services (the API and the Reverb WebSocket server — they
# sleep independently of each other) often enough that neither ever goes
# idle long enough to sleep. This is a deliberate tradeoff, not a hidden
# workaround: it keeps a free-tier service artificially "always on" rather
# than paying for an always-on plan. If Render's free tier policy changes to
# discourage this, or the project moves to a paid plan (which removes the
# sleep behavior outright, making this workflow unnecessary), delete this
# file rather than adjust it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API (sporthub-binangonan)
        run: curl -s -o /dev/null -m 20 https://sporthub-binangonan.onrender.com/up || true
      - name: Ping Reverb (sporthub-binangonan-reverb)
        run: curl -s -o /dev/null -m 20 https://sporthub-binangonan-reverb.onrender.com/ || true
