# Render Blueprint — documents the actual production topology (provisioned
# via the Render CLI/API, not `render blueprints apply` — as of this
# writing the CLI only supports `blueprints validate`, not deploying one).
# Kept here for reference/reproducibility, mirroring api/railway.web.json
# and api/railway.reverb.json for the Railway alternative.
#
# Two services share one Docker image (api/Dockerfile): "sporthub-api" runs
# the default CMD (nginx + php-fpm), "sporthub-reverb" overrides it to
# `php artisan reverb:start`. Auth is Bearer-token based (see
# api/.env.production.example for why), so no custom domain is required —
# both services can run on their default *.onrender.com URLs.

databases:
  - name: sporthub-db
    databaseName: sporthub
    user: sporthub
    plan: free

services:
  - type: web
    name: sporthub-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: api
    plan: free
    region: oregon
    healthCheckPath: /up
    # Silently ignored on the free plan ("Commands can only run on paid
    # instance types" — Render logs this but does not fail the deploy).
    # docker/entrypoint.sh runs `migrate --force` at boot as a fallback for
    # exactly this case; kept here too since it becomes the cleaner
    # pre-traffic-switch path automatically if this ever moves to a paid plan.
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_NAME
        value: Sporthub
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false # generate once with `php artisan key:generate --show`; must match sporthub-reverb
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: "" # set to this service's actual assigned URL after creation
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: BCRYPT_ROUNDS
        value: 12
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: single
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: sporthub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sporthub-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sporthub-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sporthub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sporthub-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 120
      - key: CORS_ALLOWED_ORIGINS
        value: "" # the Vercel frontend's URL
      - key: FRONTEND_URL
        value: "" # the Vercel frontend's URL
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: FILESYSTEM_DISK
        value: local
      # Render's web-service disk is ephemeral (wiped on every deploy) — the
      # "public" disk (post images, news covers, avatars) is repointed at a
      # Backblaze B2 bucket instead of local storage so uploads actually
      # persist. B2 (not Cloudflare R2) specifically because R2 requires a
      # credit/debit card on file even for its free tier; B2 needs no card
      # and gives 10GB free. See config/filesystems.php and
      # .env.production.example.
      - key: FILESYSTEM_PUBLIC_DRIVER
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false # the region string embedded in B2's endpoint hostname, e.g. us-west-004
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false # https://<account-id>.r2.cloudflarestorage.com
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: true
      - key: FILESYSTEM_PUBLIC_URL
        sync: false # the bucket's public r2.dev URL or connected custom domain
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: database
      - key: MAIL_MAILER
        value: log
      - key: REVERB_APP_ID
        sync: false # must match sporthub-reverb
      - key: REVERB_APP_KEY
        sync: false # must match sporthub-reverb
      - key: REVERB_APP_SECRET
        sync: false # must match sporthub-reverb
      - key: REVERB_HOST
        value: "" # sporthub-reverb's actual assigned URL, no scheme
      - key: REVERB_PORT
        value: 443
      - key: REVERB_SCHEME
        value: https
      - key: VAPID_PUBLIC_KEY
        sync: false # generate with Minishlink\WebPush\VAPID::createVapidKeys() — see .env.production.example
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@sporthub.test

  - type: web
    name: sporthub-reverb
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: api
    plan: free
    region: oregon
    # Overrides the image's default CMD — same env vars as sporthub-api
    # above (minus preDeployCommand; only one service should run migrations).
    dockerCommand: "php artisan reverb:start --host=0.0.0.0 --port=$PORT"
