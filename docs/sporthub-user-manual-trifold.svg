<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">SportHub User Manual Tri-Fold Brochure</title>
  <desc id="desc">A tri-fold brochure guide for the SportHub system showing system overview, key features, and user guidance.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#efefef"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffb000"/>
      <stop offset="100%" stop-color="#f58b1f"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <style>
      .title { font: 900 68px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 800 24px 'Segoe UI', Arial, sans-serif; fill: #1f2937; letter-spacing: 1px; }
      .big { font: 900 90px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .heading { font: 800 30px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .panel-title { font: 800 36px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .body { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .body-light { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #e5eefb; }
      .chip { font: 800 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; letter-spacing: 2px; }
      .orange-box { fill: url(#orange); }
      .dark-box { fill: url(#dark); }
      .white-box { fill: #f8fafc; }
      .line { stroke: #f59e0b; stroke-width: 6; }
      .thin-line { stroke: #dfe8f4; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>

  <g transform="translate(40 40)">
    <rect x="0" y="0" width="560" height="1120" rx="26" fill="#1d1d1d"/>
    <path d="M0 220 L560 0 L560 1120 L0 1120 Z" fill="#1c1c1c" opacity="0.9"/>

    <g opacity="0.2">
      <path d="M0 260 C180 140, 380 140, 560 260" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M0 360 C150 270, 420 270, 560 360" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M0 470 C150 390, 420 390, 560 470" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>

    <rect x="46" y="360" width="470" height="220" rx="16" fill="#dfe8f4" opacity="0.22"/>
    <text x="80" y="420" class="heading" fill="#ffffff">WHY CHOOSE</text>
    <text x="80" y="470" class="heading" fill="#ffffff">SPORTHUB?</text>

    <g transform="translate(80 520)">
      <text x="0" y="0" class="body-light">• Matchmaking and team coordination</text>
      <text x="0" y="38" class="body-light">• Tournament creation and results tracking</text>
      <text x="0" y="76" class="body-light">• Venue booking and scheduling</text>
      <text x="0" y="114" class="body-light">• Player, coach, and organizer access</text>
    </g>

    <g transform="translate(70 870)">
      <rect x="0" y="0" width="180" height="110" rx="20" fill="#f8fafc"/>
      <rect x="25" y="20" width="130" height="70" rx="18" fill="#eef4ff"/>
      <circle cx="88" cy="56" r="26" fill="#f59e0b"/>
      <path d="M76 56 L86 66 L100 46" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="92" text-anchor="middle" class="chip">SPORT</text>
    </g>

    <g transform="translate(280 870)">
      <rect x="0" y="0" width="180" height="110" rx="20" fill="#f8fafc"/>
      <rect x="25" y="20" width="130" height="70" rx="18" fill="#eef4ff"/>
      <circle cx="88" cy="56" r="26" fill="#f59e0b"/>
      <path d="M76 56 L88 68 L102 46" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="92" text-anchor="middle" class="chip">TEAM</text>
    </g>

    <text x="60" y="1080" class="subtitle" fill="#ffffff">SPORTHUB USER MANUAL</text>
  </g>

  <g transform="translate(620 40)">
    <rect x="0" y="0" width="560" height="1120" rx="26" fill="#f6f8fb"/>
    <rect x="0" y="0" width="560" height="140" rx="26" fill="url(#orange)"/>
    <text x="70" y="78" class="title">GET STARTED</text>
    <text x="70" y="118" class="subtitle" fill="#1f2937">SPORT COMMUNITY SYSTEM</text>

    <g transform="translate(52 190)">
      <rect x="0" y="0" width="456" height="180" rx="18" fill="#ffffff"/>
      <text x="24" y="50" class="heading">1. CREATE YOUR ACCOUNT</text>
      <text x="24" y="88" class="body">Register using your email and select your role:</text>
      <text x="24" y="122" class="body">Player, Coach, Organizer, Venue Facilitator, Admin.</text>
      <text x="24" y="156" class="body">Complete verification if required to unlock full access.</text>
    </g>

    <g transform="translate(52 398)">
      <rect x="0" y="0" width="456" height="180" rx="18" fill="#ffffff"/>
      <text x="24" y="50" class="heading">2. ACCESS YOUR DASHBOARD</text>
      <text x="24" y="88" class="body">After logging in, you will see your personalized</text>
      <text x="24" y="122" class="body">dashboard with upcoming events, matches, bookings,</text>
      <text x="24" y="156" class="body">news updates, and role-specific actions.</text>
    </g>

    <g transform="translate(52 606)">
      <rect x="0" y="0" width="456" height="180" rx="18" fill="#ffffff"/>
      <text x="24" y="50" class="heading">3. USE THE MAIN FEATURES</text>
      <text x="24" y="88" class="body">Create matches, register for tournaments, book</text>
      <text x="24" y="122" class="body">venues, update profiles, manage teams, and view</text>
      <text x="24" y="156" class="body">announcements from the dashboard.</text>
    </g>

    <g transform="translate(52 814)">
      <rect x="0" y="0" width="456" height="180" rx="18" fill="#ffffff"/>
      <text x="24" y="50" class="heading">4. KEEP YOUR ACCOUNT UPDATED</text>
      <text x="24" y="88" class="body">Alert your role account, verify details, and check</text>
      <text x="24" y="122" class="body">notifications regularly to stay informed about</text>
      <text x="24" y="156" class="body">match results, venue confirmations, and system updates.</text>
    </g>
  </g>

  <g transform="translate(1200 40)">
    <rect x="0" y="0" width="560" height="1120" rx="26" fill="#1e1f23"/>
    <rect x="0" y="0" width="560" height="120" rx="26" fill="url(#orange)"/>
    <text x="40" y="78" class="title" fill="#111827">FEATURES</text>

    <g transform="translate(52 180)">
      <rect x="0" y="0" width="456" height="200" rx="18" fill="#f8fafc"/>
      <text x="20" y="54" class="heading">PLAYER MATCHMAKING</text>
      <text x="20" y="90" class="body">Join matches, search for opponents, and</text>
      <text x="20" y="122" class="body">select the right venue and schedule for</text>
      <text x="20" y="154" class="body">your sport and team preferences.</text>
    </g>

    <g transform="translate(52 420)">
      <rect x="0" y="0" width="456" height="200" rx="18" fill="#f8fafc"/>
      <text x="20" y="54" class="heading">TOURNAMENT MANAGEMENT</text>
      <text x="20" y="90" class="body">Organizers can create events, manage</text>
      <text x="20" y="122" class="body">brackets, monitor results, and publish</text>
      <text x="20" y="154" class="body">updates to participants and supporters.</text>
    </g>

    <g transform="translate(52 660)">
      <rect x="0" y="0" width="456" height="200" rx="18" fill="#f8fafc"/>
      <text x="20" y="54" class="heading">BOOKING &amp; FACILITIES</text>
      <text x="20" y="90" class="body">Reserve venues, confirm schedules, and</text>
      <text x="20" y="122" class="body">coordinate facility access for players,</text>
      <text x="20" y="154" class="body">coaches, and organizers with ease.</text>
    </g>

    <g transform="translate(52 900)">
      <rect x="0" y="0" width="456" height="160" rx="18" fill="#f8fafc"/>
      <text x="20" y="52" class="heading">SUPPORT</text>
      <text x="20" y="90" class="body">For questions, account issues, or feature support,</text>
      <text x="20" y="122" class="body">contact your system administrator or organizer.</text>
    </g>
  </g>
</svg>
