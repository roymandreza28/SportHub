<svg width="1200" height="1800" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SportHub Tarpulin Poster</title>
  <desc id="desc">Sample poster for the SportHub system showing logo, title, system summary, mock screenshots on laptop, tablet, and mobile, developer names, and QR code.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 800 74px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #475569; letter-spacing: 3px; }
      .body { font: 500 24px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .caps { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; letter-spacing: 4px; }
      .label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .dev { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .dev-role { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="1800" fill="url(#bgGrad)"/>

  <rect x="60" y="60" width="1080" height="1680" rx="40" fill="#ffffff" stroke="#0f172a" stroke-width="6" filter="url(#softShadow)"/>

  <g transform="translate(90 110)">
    <rect x="0" y="0" width="300" height="120" rx="26" fill="#ecfeff" stroke="#cbd5e1"/>
    <image href="sporthub-logo.png" x="30" y="18" width="84" height="84" preserveAspectRatio="xMidYMid meet"/>
    <text x="140" y="58" class="title" font-size="54">SportHub</text>
    <text x="142" y="90" class="subtitle" font-size="18" letter-spacing="2">SPORTS COMMUNITY SYSTEM</text>
  </g>

  <g transform="translate(780 115)">
    <rect x="0" y="0" width="260" height="260" rx="28" fill="#f8fafc" stroke="#0f172a" stroke-width="5"/>
    <image href="sporthub-qr.png" x="23" y="23" width="214" height="214" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <text x="90" y="290" class="caps">SYSTEM OVERVIEW</text>
  <text x="90" y="360" class="body" font-size="28">
    <tspan x="90" dy="0">SportHub is a modern sports management platform that connects</tspan>
    <tspan x="90" dy="38">players, coaches, organizers, venue facilitators, and event</tspan>
    <tspan x="90" dy="38">stakeholders in one centralized digital ecosystem.</tspan>
  </text>

  <g transform="translate(90 430)">
    <rect x="0" y="0" width="1020" height="470" rx="30" fill="#f8fafc" stroke="#dbeafe" stroke-width="3"/>

    <g transform="translate(40 32)">
      <rect x="0" y="0" width="610" height="380" rx="22" fill="#0f172a"/>
      <rect x="20" y="22" width="570" height="38" rx="12" fill="#1e293b"/>
      <circle cx="52" cy="41" r="7" fill="#fb7185"/>
      <circle cx="76" cy="41" r="7" fill="#fbbf24"/>
      <circle cx="100" cy="41" r="7" fill="#34d399"/>

      <rect x="28" y="78" width="180" height="110" rx="12" fill="#f8fafc"/>
      <rect x="228" y="78" width="165" height="30" rx="10" fill="#dbeafe"/>
      <rect x="228" y="120" width="135" height="14" rx="7" fill="#e2e8f0"/>
      <rect x="228" y="146" width="150" height="14" rx="7" fill="#e2e8f0"/>

      <rect x="28" y="206" width="530" height="140" rx="16" fill="#f8fafc"/>
      <rect x="50" y="230" width="130" height="16" rx="8" fill="#cbd5e1"/>
      <rect x="50" y="260" width="240" height="16" rx="8" fill="#dbeafe"/>
      <rect x="50" y="288" width="200" height="16" rx="8" fill="#dbeafe"/>
      <rect x="420" y="230" width="100" height="72" rx="14" fill="#f59e0b"/>
      <rect x="440" y="246" width="60" height="10" rx="5" fill="#fff7ed"/>
      <rect x="440" y="268" width="48" height="10" rx="5" fill="#fff7ed" opacity="0.7"/>

      <text x="34" y="580" class="small" textLength="260">LAPTOP VIEW</text>
    </g>

    <g transform="translate(680 52)">
      <rect x="0" y="0" width="260" height="330" rx="26" fill="#e2e8f0"/>
      <rect x="18" y="18" width="224" height="294" rx="20" fill="#0f172a"/>
      <rect x="32" y="36" width="82" height="18" rx="9" fill="#f8fafc" opacity="0.8"/>
      <rect x="32" y="74" width="196" height="58" rx="16" fill="#f8fafc"/>
      <rect x="48" y="90" width="90" height="12" rx="6" fill="#dbeafe"/>
      <rect x="48" y="108" width="130" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="32" y="146" width="196" height="130" rx="14" fill="#f8fafc"/>
      <rect x="48" y="164" width="72" height="72" rx="12" fill="#38bdf8"/>
      <rect x="132" y="164" width="78" height="12" rx="6" fill="#cbd5e1"/>
      <rect x="132" y="188" width="60" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="132" y="212" width="70" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="32" y="282" width="90" height="18" rx="9" fill="#22c55e"/>
      <text x="46" y="360" class="small">TABLET VIEW</text>
    </g>

    <g transform="translate(950 90)">
      <rect x="0" y="0" width="150" height="280" rx="24" fill="#f1f5f9" stroke="#cbd5e1"/>
      <rect x="18" y="24" width="114" height="232" rx="18" fill="#0f172a"/>
      <rect x="34" y="42" width="82" height="12" rx="6" fill="#f8fafc" opacity="0.8"/>
      <rect x="34" y="68" width="82" height="64" rx="12" fill="#22c55e"/>
      <rect x="34" y="146" width="82" height="12" rx="6" fill="#dbeafe"/>
      <rect x="34" y="166" width="70" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="34" y="186" width="72" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="34" y="214" width="82" height="24" rx="12" fill="#f59e0b"/>
      <text x="28" y="310" class="small">MOBILE</text>
    </g>
  </g>

  <g transform="translate(90 960)">
    <rect x="0" y="0" width="1020" height="420" rx="30" fill="#eef2ff" stroke="#c7d2fe" stroke-width="3"/>
    <text x="42" y="56" class="caps">WHY SPORTHUB?</text>

    <g transform="translate(42 96)">
      <rect x="0" y="0" width="290" height="210" rx="24" fill="#ffffff"/>
      <circle cx="52" cy="58" r="26" fill="#dbeafe"/>
      <path d="M40 58l10 10 18-24" stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="94" y="60" class="dev">Matchmaking</text>
      <text x="30" y="120" class="body" font-size="20">Connect players, teams,</text>
      <text x="30" y="152" class="body" font-size="20">and venues in one</text>
      <text x="30" y="184" class="body" font-size="20">streamlined system.</text>
    </g>

    <g transform="translate(365 96)">
      <rect x="0" y="0" width="290" height="210" rx="24" fill="#ffffff"/>
      <circle cx="52" cy="58" r="26" fill="#dcfce7"/>
      <path d="M38 60c5-18 28-20 32 0" stroke="#16a34a" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M40 72h28" stroke="#16a34a" stroke-width="8" fill="none" stroke-linecap="round"/>
      <text x="94" y="60" class="dev">Tournament</text>
      <text x="30" y="120" class="body" font-size="20">Plan events, monitor</text>
      <text x="30" y="152" class="body" font-size="20">brackets, and manage</text>
      <text x="30" y="184" class="body" font-size="20">live game flow.</text>
    </g>

    <g transform="translate(688 96)">
      <rect x="0" y="0" width="290" height="210" rx="24" fill="#ffffff"/>
      <circle cx="52" cy="58" r="26" fill="#fef3c7"/>
      <path d="M35 70h34M52 52v36" stroke="#f59e0b" stroke-width="8" fill="none" stroke-linecap="round"/>
      <text x="94" y="60" class="dev">Bookings</text>
      <text x="30" y="120" class="body" font-size="20">Reserve courts, track</text>
      <text x="30" y="152" class="body" font-size="20">facilitator details,</text>
      <text x="30" y="184" class="body" font-size="20">and streamline operations.</text>
    </g>
  </g>

  <g transform="translate(90 1435)">
    <text x="0" y="0" class="caps">DEVELOPERS</text>
    <g transform="translate(0 34)">
      <rect x="0" y="0" width="300" height="120" rx="18" fill="#ffffff" stroke="#dbeafe"/>
      <circle cx="52" cy="58" r="30" fill="#0f172a"/>
      <text x="94" y="55" class="dev" font-size="24">Roy M. Reza</text>
      <text x="94" y="86" class="dev-role">Lead Developer</text>
    </g>
    <g transform="translate(340 34)">
      <rect x="0" y="0" width="300" height="120" rx="18" fill="#ffffff" stroke="#dbeafe"/>
      <circle cx="52" cy="58" r="30" fill="#1d4ed8"/>
      <text x="94" y="55" class="dev" font-size="24">Alyssa Cruz</text>
      <text x="94" y="86" class="dev-role">System Designer</text>
    </g>
    <g transform="translate(680 34)">
      <rect x="0" y="0" width="300" height="120" rx="18" fill="#ffffff" stroke="#dbeafe"/>
      <circle cx="52" cy="58" r="30" fill="#f97316"/>
      <text x="94" y="55" class="dev" font-size="24">Martin Dela Vega</text>
      <text x="94" y="86" class="dev-role">Project Developer</text>
    </g>
  </g>

  <g transform="translate(90 1600)">
    <rect x="0" y="0" width="860" height="90" rx="20" fill="#f8fafc" stroke="#dbeafe"/>
    <text x="30" y="38" class="body" font-size="22">SportHub brings sport coordination, venue scheduling, team management, and community engagement into a single, easy-to-use platform for every user role.</text>
  </g>
</svg>
