    <circle cx="70" cy="70" r="56" fill="#0d1729" stroke="#f4f7ff" stroke-width="2"/>
    <circle cx="70" cy="70" r="42" fill="#87e3ff"/>
    <path d="M70 40 L86 58 L70 104 L54 58 Z" fill="#ffffff"/>
  </g>

  <g transform="translate(530 1422)">
    <circle cx="70" cy="70" r="70" fill="#f4f7ff"/>
    <circle cx="70" cy="70" r="56" fill="#0d1729" stroke="#f4f7ff" stroke-width="2"/>
    <circle cx="70" cy="70" r="42" fill="#87e3ff"/>
    <path d="M70 40 L86 58 L70 104 L54 58 Z" fill="#ffffff"/>
  </g>

  <g transform="translate(940 1422)">
    <circle cx="70" cy="70" r="70" fill="#f4f7ff"/>
    <circle cx="70" cy="70" r="56" fill="#0d1729" stroke="#f4f7ff" stroke-width="2"/>
    <circle cx="70" cy="70" r="42" fill="#87e3ff"/>
    <path d="M70 40 L86 58 L70 104 L54 58 Z" fill="#ffffff"/>
