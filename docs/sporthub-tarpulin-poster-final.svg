  <g transform="translate(120 1050)">
    <text x="0" y="0" class="summary" font-size="38" fill="#f3f7ff">A sports community system for:</text>
    <text x="0" y="62" class="summary" font-size="38" fill="#f3f7ff">Matchmaking • Tournaments • Facilities • Scheduling</text>
  </g>

  <g transform="translate(70 1200)">
    <line x1="0" y1="0" x2="1060" y2="0" stroke="#dfe8f4" stroke-opacity="0.5" stroke-width="2"/>
  </g>

