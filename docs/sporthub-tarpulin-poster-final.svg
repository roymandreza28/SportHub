      <circle cx="86" cy="86" r="74" fill="#f3f7ff"/>
      <circle cx="86" cy="86" r="52" fill="#f4f7ff"/>
      <path d="M58 88 L86 58 L114 88 M58 108 H114" stroke="#111827" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="86" cy="86" r="12" fill="#ff4d4d"/>
    </g>
  </g>

  <g transform="translate(826 820)">
    <rect x="0" y="0" width="270" height="210" rx="22" fill="#f3f7ff"/>
    <rect x="24" y="22" width="222" height="166" rx="12" fill="#ffffff" stroke="#0b1320" stroke-width="4"/>
    <g transform="translate(52 44)">
      <rect x="0" y="0" width="164" height="116" rx="6" fill="#ffffff" stroke="#0b1320" stroke-width="3"/>
      <rect x="14" y="16" width="55" height="55" fill="#ffffff" stroke="#0b1320" stroke-width="3"/>
      <rect x="82" y="20" width="18" height="18" fill="#0b1320"/>
      <rect x="108" y="20" width="18" height="18" fill="#0b1320"/>
      <rect x="134" y="20" width="18" height="18" fill="#0b1320"/>
      <rect x="82" y="46" width="68" height="12" fill="#0b1320"/>
      <rect x="82" y="66" width="54" height="12" fill="#0b1320"/>
