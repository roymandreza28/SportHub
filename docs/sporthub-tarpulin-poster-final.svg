    <circle cx="1000" cy="326" r="4" fill="#f4f7ff"/>
    <circle cx="900" cy="280" r="4" fill="#f4f7ff"/>
    <circle cx="760" cy="360" r="4" fill="#f4f7ff"/>
    <circle cx="580" cy="340" r="4" fill="#f4f7ff"/>
    <circle cx="440" cy="310" r="4" fill="#f4f7ff"/>
    <circle cx="280" cy="360" r="4" fill="#f4f7ff"/>
    <circle cx="142" cy="402" r="4" fill="#f4f7ff"/>
    <circle cx="150" cy="560" r="4" fill="#f4f7ff"/>
    <circle cx="310" cy="620" r="4" fill="#f4f7ff"/>
    <circle cx="560" cy="600" r="4" fill="#f4f7ff"/>
    <circle cx="840" cy="610" r="4" fill="#f4f7ff"/>
    <circle cx="1038" cy="560" r="4" fill="#f4f7ff"/>
    <circle cx="1124" cy="660" r="4" fill="#f4f7ff"/>
    <circle cx="960" cy="760" r="4" fill="#f4f7ff"/>
    <circle cx="740" cy="730" r="4" fill="#f4f7ff"/>
