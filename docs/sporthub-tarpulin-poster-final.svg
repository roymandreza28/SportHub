    <circle cx="230" cy="720" r="4" fill="#f4f7ff"/>
    <circle cx="110" cy="820" r="4" fill="#f4f7ff"/>
  </g>

  <g transform="translate(0 0)">
    <rect x="62" y="52" width="1076" height="6" fill="#dfe8f4" opacity="0.9"/>
  </g>

  <g transform="translate(110 120)">
    <text x="0" y="0" class="headline">ORGANIZE.</text>
    <text x="0" y="180" class="headline">MOBILIZE.</text>
    <text x="0" y="360" class="headline">DELIVER.</text>
  </g>

  <g transform="translate(96 470)">
    <rect x="0" y="0" width="1008" height="320" rx="28" fill="#111827" stroke="#e5edf9" stroke-opacity="0.18"/>
    <text x="52" y="92" class="summaryLarge">SPORTS COMMUNITY MANAGEMENT SYSTEM</text>
    <text x="52" y="180" class="summary">A web-based sports platform that connects players, coaches, venue</text>
    <text x="52" y="225" class="summary">facilitators, organizers, and supporters in one centralized</text>
    <text x="52" y="270" class="summary">digital ecosystem for scheduling, matchmaking, and event coordination.</text>
  </g>

  <g transform="translate(104 860)">
    <g transform="translate(0 0)">
      <circle cx="86" cy="86" r="74" fill="#f3f7ff"/>
      <circle cx="86" cy="86" r="52" fill="#f4f7ff"/>
      <path d="M58 86 L86 52 L114 86 M60 112 H112" stroke="#111827" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="86" cy="38" r="18" fill="#ff4d4d"/>
