<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">SportHub Poster</title>
  <desc id="desc">Dark poster matching the reference style with large red headline, summary panel, icon row, and QR code display.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#070d14"/>
      <stop offset="100%" stop-color="#0d1a2c"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#dc1f26"/>
    </linearGradient>
    <filter id="nameGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.25"/>
    </filter>
    <style>
      .headline { font: 900 210px 'Segoe UI', Arial, sans-serif; fill: url(#redGlow); letter-spacing: -10px; }
      .section { font: 800 42px 'Segoe UI', Arial, sans-serif; fill: #edf4ff; letter-spacing: 8px; }
      .summary { font: 600 30px 'Segoe UI', Arial, sans-serif; fill: #eef5ff; }
      .summaryLarge { font: 700 60px 'Segoe UI', Arial, sans-serif; fill: #f4f7ff; }
    </style>
  </defs>

  <rect width="1200" height="1800" fill="url(#bg)"/>

  <g opacity="0.35">
    <circle cx="88" cy="80" r="4" fill="#f4f7ff"/>
    <circle cx="170" cy="120" r="4" fill="#f4f7ff"/>
